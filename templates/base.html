<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Renowned Homes — London & South East New Homes Specialists{% endblock %}</title>
  
  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231b3729'/><text x='50%' y='68%' font-size='60' font-weight='bold' fill='%23c4962a' text-anchor='middle' font-family='serif'>RH</text></svg>">
  
  <!-- Google Fonts: Playfair Display, Urbanist & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Urbanist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Custom Brand & Popups CSS -->
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/brand.css' %}">
  <link rel="stylesheet" href="{% static 'css/popups.css' %}">
  
  {% block extra_css %}{% endblock %}
</head>
<body>

  <!-- Toast Notification Container (Fixed) -->
  <div id="rhToastContainer"></div>

  <!-- Page Content Block -->
  {% block content %}{% endblock %}

  <!-- Bootstrap 5 Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Custom Popups & Toast Library -->
  <script src="{% static 'js/popups.js' %}"></script>
  
  <!-- Django Messages to Toast Dispatcher -->
  {% if messages %}
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      {% for message in messages %}
        window.showToast(
          "{{ message.tags|capfirst }}",
          "{{ message|escapejs }}",
          "{% if message.tags == 'error' %}error{% elif message.tags == 'warning' %}warning{% else %}success{% endif %}",
          4500
        );
      {% endfor %}
    });
  </script>
  {% endif %}

  {% block extra_js %}{% endblock %}
</body>
</html>
